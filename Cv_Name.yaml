design:
  theme: engineeringclassic

  page:
    top_margin: 0.35in
    bottom_margin: 0.35in
    left_margin: 0.45in
    right_margin: 0.45in
    show_top_note: false

  typography:
    line_spacing: 0.44em
    font_size:
      body: 9pt
      name: 20pt

  header:
    space_below_name: 0.12cm
    space_below_headline: 0.12cm
    space_below_connections: 0.12cm

  section_titles:
    space_above: 0.15cm
    space_below: 0.07cm

  sections:
    space_between_regular_entries: 0.15cm
    space_between_text_based_entries: 0.06cm

  entries:
    date_and_location_width: 3.5cm
    side_space: 0.1cm
    space_between_columns: 0.1cm

    summary:
      space_above: 0cm

    highlights:
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.3em

locale:
  language: english

settings:
  current_date: today

  render_command:
